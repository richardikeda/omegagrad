[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omegagrad-lab"
version = "1.0.0"
description = "Experimental finite-prime geometry by Richard Ikeda, Author & Lead Investigator"
authors = [{name = "Richard Ikeda"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
report = ["reportlab>=4", "pypdf>=5"]

[project.scripts]
omegagrad = "omegagrad.experiments:main"

[tool.setuptools.packages.find]
include = ["omegagrad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
